name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hexwave/radio test
      - run: pnpm --filter @hexwave/radio typecheck
      - run: pnpm --filter @hexwave/radio build

  resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ytaudio/requirements.txt pytest
      - run: python -m pytest ytaudio/test_resolve.py -q
